# Publishes n8n-nodes-ashdocs to npm with a provenance statement when a GitHub release is published.
#
# n8n verifies community nodes only if they were published from GitHub Actions with npm provenance
# (required since 1 May 2026):
# https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/
#
# One-time setup: create a granular npm access token that can publish this package and save it as
# the NPM_TOKEN repository secret (Settings → Secrets and variables → Actions). See PUBLISHING.md.
#
# Release: bump "version" in package.json and CHANGELOG.md, push, then publish a GitHub release whose
# tag is v<version> (for example v1.0.0). This workflow refuses to publish if the two don't match.

name: Publish

on:
  release:
    types: [published]

permissions:
  # Lets the job mint the GitHub OIDC token that npm signs the provenance statement with.
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The package's prepublishOnly guard (n8n-node prerelease) blocks any publish without this,
          # so a plain `npm publish` from a laptop fails on purpose.
          RELEASE_MODE: 'true'
